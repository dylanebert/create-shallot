name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run lint
      - run: bun run test
      - name: Tag matches package version
        run: test "v$(jq -r .version package.json)" = "${{ github.ref_name }}"
