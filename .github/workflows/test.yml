name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test --timeout=250
      - run: bun test ./tests/package-preflight.node.ts
      - name: scaffold and run the browser tier
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/create-shallot-browser"
          candidate_dir="$(realpath node_modules/@dylanebert/shallot)"
          (cd "$candidate_dir" && bun pm pack --ignore-scripts --destination "$RUNNER_TEMP" --quiet)
          candidate_archive="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'dylanebert-shallot-*.tgz' -print -quit)"
          test -n "$candidate_archive"
          bun run ./src/index.ts "$app"
          cd "$app"
          CANDIDATE_ARCHIVE="$candidate_archive" bun -e 'const p=await Bun.file("package.json").json(); p.dependencies["@dylanebert/shallot"] = `file:${process.env.CANDIDATE_ARCHIVE}`; await Bun.write("package.json", JSON.stringify(p,null,2)+"\n")'
          bun install
          bun test --timeout=250
          bunx playwright install --with-deps chromium
          bun run test:browser
